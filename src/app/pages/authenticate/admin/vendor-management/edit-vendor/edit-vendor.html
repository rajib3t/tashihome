<app-page-breadcrumb
  pageTitle="Edit Vendor"
  homelink="/admin"
  [breadcrumbs]="[
    { label: 'Vendor Management', url: '/admin/vendor-management' },
    { label: 'Edit Vendor' }
  ]">
</app-page-breadcrumb>
<div class="space-y-6">
  <app-card title="Edit Vendor" desc="Manage and update vendor profile information.">
        @if (vendor(); as vendor) {
            <app-meta-card 
              [user]="vendor" 
              [editForm]="vendorForm" 
              [isUpdating]="isUpdating()"
              [errorMessage]="errorMessage()"
              [isSubmitting]="isUpdating()"
              (avatarUpload)="uploadAvatar($event)"
              (save)="updateVendor($event)"
              [uploadErrorMessage]="imageUploadError()"
            ></app-meta-card>

        }

        @if (vendor(); as vendor) {
            <app-company-card 
              [user]="vendor" 
              [editForm]="vendorForm" 
              [isUpdating]="isUpdating()"
              [errorMessage]="errorMessage()"
              [isSubmitting]="isUpdating()"
              (save)="updateVendor($event)"
            ></app-company-card>
        }
    </app-card>
</div>
