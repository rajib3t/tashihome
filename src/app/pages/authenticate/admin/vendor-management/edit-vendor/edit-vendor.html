<app-page-breadcrumb
  pageTitle="Edit Vendor"
  homelink="/admin"
  [breadcrumbs]="[
    { label: 'Vendor Management', url: '/admin/vendor-management' },
    { label: 'Edit Vendor' }
  ]">
</app-page-breadcrumb>
<div class="space-y-6">
  <app-card title="Edit Vendor" desc="Manage and update vendor profile information.">
        @if (vendor(); as vendor) {
            <app-meta-card 
              [user]="vendor" 
              [editForm]="vendorForm" 
              (avatarUpload)="uploadAvatar($event)"
            ></app-meta-card>

        }
    </app-card>
</div>
