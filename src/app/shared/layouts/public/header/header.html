<!-- ============ NAV ============ -->
<header
  id="site-nav"
  class="fixed top-0 inset-x-0 z-50 transition-all duration-300"
  [ngClass]="{
    'nav-blur bg-[#f5f1e6]/90 shadow-sm border-b border-ink/5': isScrolled,
    'bg-transparent': !isScrolled
  }"
>
  <div class="max-w-7xl mx-auto px-6 lg:px-10 flex items-center justify-between h-20">
    <a routerLink="/" class="flex items-center gap-2.5 group">
      <app-logo [size]="40" [glow]="false" [withText]="true" [href]="null" [variant]="isScrolled ? 'dark' : 'white'">
      </app-logo>
    </a>

    <nav class="hidden md:flex items-center gap-8 text-sm font-medium transition-colors" [ngClass]="isScrolled ? 'text-ink' : 'text-cloud'">
      <a routerLink="/" fragment="stays" class="hover:text-ochre transition-colors">Stays</a>
      <a routerLink="/our-story" class="hover:text-ochre transition-colors">Our Story</a>
      <a routerLink="/" fragment="experiences" class="hover:text-ochre transition-colors">Experiences</a>
      <a routerLink="/" fragment="hosts" class="hover:text-ochre transition-colors">Hosts</a>
      <a routerLink="/" fragment="how" class="hover:text-ochre transition-colors">How it works</a>
    </nav>

    <div class="flex items-center gap-3">
      <ng-container *ngIf="isAuthenticated(); else loginTemplate">
        <a (click)="navigateToProfile()" class="hidden sm:flex w-10 h-10 rounded-full bg-cloud2 items-center justify-center text-pine text-xs font-semibold hover:text-ochreD transition-colors cursor-pointer" title="Your profile"><app-avatar [name]="authUser()?.full_name || 'User'" [src]="authUser()?.is_profile_image_url || undefined" [size]="40"></app-avatar></a>
        <button type="button" (click)="signOut()" class="hidden sm:inline-block text-sm font-semibold hover:text-ochreD" [class.text-ink]="isScrolled" [class.text-cloud]="!isScrolled">Sign out</button>
      </ng-container>
      <ng-template #loginTemplate>
        <a
          routerLink="/login"
          class="btn-anim hidden sm:inline-block bg-ochre hover:bg-ochreD text-cloud text-sm font-semibold px-5 py-2.5 rounded-full transition-colors"
        >
          Login
        </a>
      </ng-template>
      <a
        routerLink="/"
        fragment="stays"
        class="btn-anim hidden sm:inline-block bg-ochre hover:bg-ochreD text-cloud text-sm font-semibold px-5 py-2.5 rounded-full transition-colors"
      >
        Browse stays
      </a>
      <button
        id="menu-btn"
        (click)="toggleMenu()"
        class="md:hidden w-10 h-10 grid place-items-center rounded-full border border-current/30 transition-colors"
        [ngClass]="isScrolled ? 'text-ink' : 'text-cloud'"
        aria-label="Open menu"
        [attr.aria-expanded]="isMenuOpen"
      >
        <svg id="menu-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M1 4H17M1 9H17M1 14H17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </div>

  <!-- mobile menu -->
  <div *ngIf="isMenuOpen" id="mobile-menu" class="md:hidden bg-pine text-cloud px-6 pb-6 pt-2 space-y-4 shadow-xl border-t border-cloud/10">
    <a routerLink="/" fragment="stays" (click)="closeMenu()" class="block text-sm font-medium hover:text-ochre">Stays</a>
    <a routerLink="/our-story" (click)="closeMenu()" class="block text-sm font-medium hover:text-ochre">Our Story</a>
    <a routerLink="/" fragment="experiences" (click)="closeMenu()" class="block text-sm font-medium hover:text-ochre">Experiences</a>
    <a routerLink="/" fragment="hosts" (click)="closeMenu()" class="block text-sm font-medium hover:text-ochre">Hosts</a>
    <a routerLink="/" fragment="how" (click)="closeMenu()" class="block text-sm font-medium hover:text-ochre">How it works</a>
    <ng-container *ngIf="isAuthenticated(); else mobileLoginTemplate">
      <a (click)="navigateToProfile(); closeMenu()" class="block text-sm font-medium hover:text-ochre">Profile</a>
      <button type="button" (click)="signOut(); closeMenu()" class="block text-sm font-medium hover:text-ochre">Sign out</button>
    </ng-container>
    <ng-template #mobileLoginTemplate>
      <a routerLink="/login" (click)="closeMenu()" class="block text-sm font-medium hover:text-ochre">Login</a>
    </ng-template>
    <a routerLink="/" fragment="stays" (click)="closeMenu()" class="inline-block bg-ochre text-cloud text-sm font-semibold px-5 py-2.5 rounded-full">
      Browse stays
    </a>
  </div>
</header>
