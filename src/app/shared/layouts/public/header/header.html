<!-- ============ NAV ============ -->
<header
  id="site-nav"
  class="fixed top-0 inset-x-0 z-50 transition-all duration-300"
  [ngClass]="{
    'nav-blur bg-[#f5f1e6]/90 shadow-sm border-b border-ink/5': isScrolled,
    'bg-transparent': !isScrolled
  }"
>
  <div class="max-w-7xl mx-auto px-6 lg:px-10 flex items-center justify-between h-20">
    <a routerLink="/" class="flex items-center gap-2.5 group">
      <app-logo [size]="40" [glow]="false" [withText]="true" [href]="null" [variant]="isScrolled ? 'dark' : 'white'">
      </app-logo>
    </a>

    <nav class="hidden md:flex items-center gap-8 text-sm font-medium transition-colors" [ngClass]="isScrolled ? 'text-ink' : 'text-cloud'">
      <a routerLink="/search" class="hover:text-ochre transition-colors flex items-center gap-1.5">
        <svg class="w-4 h-4 text-ochre" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        Search
      </a>
      <a routerLink="/stays" class="hover:text-ochre transition-colors">Stays</a>
      
      <a routerLink="/experiences" class="hover:text-ochre transition-colors">Experiences</a>
      <a routerLink="/our-story" class="hover:text-ochre transition-colors">Our Story</a>
      <a routerLink="/become-a-host" class="hover:text-ochre transition-colors">Become a Host</a>
      
    </nav>

    <div class="flex items-center gap-3">
      <ng-container *ngIf="isAuthenticated(); else loginTemplate">
        <a (click)="navigateToProfile()" class="hidden sm:flex w-10 h-10 rounded-full overflow-hidden border border-ink/10 items-center justify-center text-pine text-xs font-semibold hover:text-ochreD transition-colors cursor-pointer" title="Your profile">
          <app-avatar [name]="authUser()?.full_name || 'User'" [src]="userAvatarUrl" [size]="40"></app-avatar>
        </a>
        <button type="button" (click)="signOut()" class="hidden sm:inline-block text-sm font-semibold hover:text-ochreD cursor-pointer" [class.text-ink]="isScrolled" [class.text-cloud]="!isScrolled">Sign out</button>
      </ng-container>
      <ng-template #loginTemplate>
        <a
          routerLink="/login"
          class="btn-anim hidden sm:inline-block bg-ochre hover:bg-ochreD text-cloud text-sm font-semibold px-5 py-2.5 rounded-full transition-colors"
        >
          Login
        </a>
      </ng-template>
      <a
        routerLink="/stays"
        class="btn-anim hidden sm:inline-block bg-ochre hover:bg-ochreD text-cloud text-sm font-semibold px-5 py-2.5 rounded-full transition-colors"
      >
        Browse stays
      </a>
      <button
        id="menu-btn"
        (click)="toggleMenu()"
        class="md:hidden w-10 h-10 grid place-items-center rounded-full border border-current/30 transition-colors"
        [ngClass]="isScrolled ? 'text-ink' : 'text-cloud'"
        aria-label="Open menu"
        [attr.aria-expanded]="isMenuOpen"
      >
        <svg id="menu-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M1 4H17M1 9H17M1 14H17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </div>

  <!-- mobile menu -->
  <div *ngIf="isMenuOpen" id="mobile-menu" class="md:hidden bg-pine text-cloud px-6 pb-6 pt-2 space-y-4 shadow-xl border-t border-cloud/10">
    <a routerLink="/search" (click)="closeMenu()" class="block text-sm font-medium hover:text-ochre flex items-center gap-2">
      <svg class="w-4 h-4 text-ochre" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      Search Homestays
    </a>
    <a routerLink="/stays" (click)="closeMenu()" class="block text-sm font-medium hover:text-ochre">Stays</a>
    <a routerLink="/locations" (click)="closeMenu()" class="block text-sm font-medium hover:text-ochre">Locations</a>
    <a routerLink="/experiences" (click)="closeMenu()" class="block text-sm font-medium hover:text-ochre">Experiences</a>
    <a routerLink="/our-story" (click)="closeMenu()" class="block text-sm font-medium hover:text-ochre">Our Story</a>
    <a routerLink="/become-a-host" (click)="closeMenu()" class="block text-sm font-medium hover:text-ochre">Become a Host</a>
    <a routerLink="/" fragment="how" (click)="closeMenu()" class="block text-sm font-medium hover:text-ochre">How it works</a>
    <ng-container *ngIf="isAuthenticated(); else mobileLoginTemplate">
      <div class="flex items-center gap-3">
        <app-avatar [name]="authUser()?.full_name || 'User'" [src]="userAvatarUrl" [size]="32"></app-avatar>
        <a (click)="navigateToProfile(); closeMenu()" class="block text-sm font-medium hover:text-ochre cursor-pointer">Profile</a>
      </div>
      <button type="button" (click)="signOut(); closeMenu()" class="block text-sm font-medium hover:text-ochre cursor-pointer">Sign out</button>
    </ng-container>
    <ng-template #mobileLoginTemplate>
      <a routerLink="/login" (click)="closeMenu()" class="block text-sm font-medium hover:text-ochre">Login</a>
    </ng-template>
    <a routerLink="/stays" (click)="closeMenu()" class="inline-block bg-ochre text-cloud text-sm font-semibold px-5 py-2.5 rounded-full">
      Browse stays
    </a>
    @if (settingService.contactPhone()) {
      <div class="pt-3 border-t border-cloud/10 text-xs text-cloud/60">
        <a [href]="'tel:' + settingService.contactPhone()" class="flex items-center gap-2 hover:text-ochre">
          <svg class="w-3.5 h-3.5 text-ochre" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
          {{ settingService.contactPhone() }}
        </a>
      </div>
    }
  </div>
</header>
