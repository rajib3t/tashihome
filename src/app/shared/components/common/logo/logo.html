@if (href) {
<a [routerLink]="[href]" [attr.aria-label]="applicationName() + ' home'">
  <ng-container *ngTemplateOutlet="logoContent"></ng-container>
</a>
} @else {
<ng-container *ngTemplateOutlet="logoContent"></ng-container>
}

<ng-template #logoContent>
  <span class="group inline-flex items-center gap-2.5" [ngClass]="className">
    <!-- Logo Mark -->
    <span class="relative inline-flex flex-shrink-0 items-center justify-center">
      @if (glow) {
      <span
        class="absolute inset-0 -z-10 rounded-full bg-ochre/30 blur-md animate-pulse"
        [style.width.px]="size"
        [style.height.px]="size"
        aria-hidden="true"
      >
      </span>
      }

      <ng-container *ngIf="(theme$ | async) as currentTheme; else defaultTheme">
        <img
          [src]="getLogoSrc(currentTheme)"
          [attr.alt]="applicationName() + ' Logo'"
          [width]="size"
          [height]="size"
          class="transition-transform duration-300 group-hover:scale-105 object-contain"
        />
      </ng-container>
      <ng-template #defaultTheme>
        <img
          [src]="getLogoSrc(null)"
          [attr.alt]="applicationName() + ' Logo'"
          [width]="size"
          [height]="size"
          class="transition-transform duration-300 group-hover:scale-105 object-contain"
        />
      </ng-template>
    </span>

    <!-- Text -->
    @if (withText) {
    <span class="flex flex-col leading-none">
      <span
        class="font-display text-xl tracking-tight transition-colors duration-300"
        [ngClass]="getTextClass(theme$ | async)"
      >
        {{ applicationName() }}
      </span>

      @if (tagline) {
      <span class="text-[10px] font-medium uppercase tracking-[0.2em] opacity-7" [ngClass]="getTextClass(theme$ | async)">
        {{ tagline }}
      </span>
      }
    </span>
    }
  </span>
</ng-template>
