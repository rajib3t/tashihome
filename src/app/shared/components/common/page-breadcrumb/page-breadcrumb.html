<div class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <h2 class="text-xl font-semibold text-gray-800 dark:text-white/90">
        {{ pageTitle }}
    </h2>
    <nav>
        <ol class="flex items-center gap-1.5 flex-wrap">
            <li>
                <a class="inline-flex items-center gap-1.5 text-sm text-gray-500 dark:text-gray-400"
                    [routerLink]="homelink">
                    Home
                    <svg class="stroke-current" width="17" height="16" viewBox="0 0 17 16" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path d="M6.0765 12.667L10.2432 8.50033L6.0765 4.33366" stroke="" stroke-width="1.2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </a>
            </li>

            @if (breadcrumbs.length) {
                @for (crumb of breadcrumbs; track crumb.label; let isLast = $last) {
                    <li class="text-sm text-gray-800 dark:text-white/90">
                        @if (crumb.url && !isLast) {
                            <a [routerLink]="crumb.url" class="text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-white">
                                {{ crumb.label }}
                            </a>
                        } @else {
                            <span class="text-gray-800 dark:text-white/90">{{ crumb.label }}</span>
                        }
                    </li>

                    @if (!isLast) {
                        <li class="text-gray-400 dark:text-gray-500">/</li>
                    }
                }
            } @else {
                <li class="text-sm text-gray-800 dark:text-white/90">
                    {{ pageTitle }}
                </li>
            }
        </ol>
    </nav>
</div>
