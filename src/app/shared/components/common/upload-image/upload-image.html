<div>

  <div
    class="group relative flex h-48 w-full items-center justify-center overflow-hidden rounded-lg border-2 border-dashed border-gray-300 bg-gray-50 transition-colors hover:border-gray-400">

    @switch (previewType()) {

      @case ('image') {

        <img
          [src]="resolvedPreview()"
          [alt]="alt()"
          class="h-full w-full object-cover transition-transform duration-200 group-hover:scale-105" />

      }

      @case ('video') {

        <video
          [src]="resolvedPreview()"
          controls
          class="h-full w-full object-cover">
        </video>

      }

      @case ('pdf') {

        <object
          [data]="resolvedPreview()"
          type="application/pdf"
          class="h-full w-full">

          <div class="flex flex-col items-center gap-2 text-center text-sm text-gray-500">
            <svg class="size-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            PDF preview unavailable
          </div>

        </object>

      }

      @case ('word') {

        <a
          [href]="resolvedPreview()"
          target="_blank"
          rel="noopener noreferrer"
          class="flex flex-col items-center gap-2 text-gray-600 transition-colors hover:text-blue-600">

          <svg class="size-12 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>

          <span class="text-sm font-medium">Open Document</span>

        </a>

      }

      @case ('presentation') {

        <a
          [href]="resolvedPreview()"
          target="_blank"
          rel="noopener noreferrer"
          class="flex flex-col items-center gap-2 text-gray-600 transition-colors hover:text-orange-600">

          <svg class="size-12 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
          </svg>

          <span class="text-sm font-medium">Open Presentation</span>

        </a>

      }

      @case ('spreadsheet') {

        <a
          [href]="resolvedPreview()"
          target="_blank"
          rel="noopener noreferrer"
          class="flex flex-col items-center gap-2 text-gray-600 transition-colors hover:text-green-600">

          <svg class="size-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>

          <span class="text-sm font-medium">Open Spreadsheet</span>

        </a>

      }

      @case ('file') {

        <div class="flex flex-col items-center gap-2 text-center text-sm text-gray-500">

          <svg class="size-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>

          File Preview Not Supported

        </div>

      }

      @default {

        <div class="flex flex-col items-center gap-2 text-center text-sm text-gray-400">

          <svg class="size-10 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14M14 8h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>

          {{ emptyText() }}

        </div>

      }

    }

  </div>

  <label
    [for]="id()"
    class="mt-4 flex cursor-pointer items-center justify-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm transition-colors hover:border-gray-400 hover:bg-gray-50 focus-within:ring-2 focus-within:ring-blue-500 focus-within:ring-offset-1"
    [class.pointer-events-none]="disabled()"
    [class.opacity-50]="disabled()">

    <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M12 12v9m0-9l-3 3m3-3l3 3" />
    </svg>

    Upload

    <input
      hidden
      type="file"
      [id]="id()"
      [name]="name()"
      [accept]="accept()"
      [disabled]="disabled()"
      (change)="onFileChange($event)" />

  </label>

</div>
