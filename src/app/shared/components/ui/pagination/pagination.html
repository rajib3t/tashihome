@if (meta && getTotalPages() > 1) {
<div class="pagination-container">
    <div class="pagination-size">
        <label class="pagination-size-label" for="page-size-select">Rows per page</label>
        <select
            id="page-size-select"
            class="pagination-size-select"
            [value]="meta.size"
            (change)="changePageSize($any($event.target).value)"
            aria-label="Rows per page"
        >
            @for (size of pageSizeOptions; track size) {
                <option [value]="size">{{ size }}</option>
            }
        </select>
    </div>
    <div class="pagination-info">
        Showing {{ (meta.page - 1) * meta.size + 1 }} to {{ getShowingTo() }} of {{ meta.total }} entries
    </div>
    <div class="pagination-controls">
        <button
            (click)="changePage(meta.page - 1)"
            [disabled]="meta.page === 1"
            class="pagination-btn pagination-btn-prev">
            Previous
        </button>
        @for (page of getPageNumbers(); track page) {
        <button
            (click)="changePage(page)"
            [class.pagination-btn-active]="page === meta.page"
            class="pagination-btn pagination-btn-page">
            {{ page }}
        </button>
        }
        <button
            (click)="changePage(meta.page + 1)"
            [disabled]="meta.page === getTotalPages()"
            class="pagination-btn pagination-btn-next">
            Next
        </button>
    </div>
</div>
}
